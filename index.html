<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pages Test</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 400px;
    }

    h1 {
      color: #333;
      margin-bottom: 15px;
    }

    p {
      color: #666;
      margin-bottom: 20px;
    }

    button {
      background: #0078ff;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    button:hover {
      background: #005fd1;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🚀 GitHub Pages is Working!</h1>

    <p>This website is successfully deployed using GitHub Pages.</p>

    <button onclick="showMessage()">
      Click Me
    </button>

    <p id="message"></p>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").innerHTML =
        "🎉 Congratulations! JavaScript is working perfectly.";
    }

  </script>
  <script type="text/javascript">var subscribersSiteId='fac69362-c367-40f6-84c9-aa1b299b477c';</script><script type="text/javascript" src="https://cdn.subscribers.com/assets/subscribers.js"></script>

</body>
</html>
